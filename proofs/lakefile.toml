# The Lean 4 proofs of the evidence calculus of mlir-trait-dialect (SPEC.md sections 3 to 7).
# Standard library only. Build with `lake build` from this directory.
name = "proofs"
defaultTargets = ["EvidenceCalculus"]

[[lean_lib]]
name = "EvidenceCalculus"
# One module per file, all at the project root. The import graph is
#   Defs <- Logic <- Calculus <- {Soundness, Completeness, Coherence, Minimality, Erasure, Findings, ReqAdmissible}
# and the theorem files never import each other.
roots = ["Defs", "Logic", "Calculus", "Soundness", "Completeness", "Coherence", "Minimality", "Erasure", "Findings", "ReqAdmissible"]
